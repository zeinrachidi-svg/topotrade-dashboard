function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function tryDecrypt() {

  const errEl = document.getElementById('err');
  errEl.style.display = 'none';
  try {
    const enc = new TextEncoder();
    const salt = b64ToBytes(PAYLOAD.salt);
    const iv = b64ToBytes(PAYLOAD.iv);
    const ciphertext = b64ToBytes(PAYLOAD.ciphertext);

    const baseKey = await crypto.subtle.importKey(
      "raw", enc.encode(pw), { name: "PBKDF2" }, false, ["deriveKey"]
    );
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: PAYLOAD.iterations, hash: "SHA-256" },
      baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
    );
    const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ciphertext);
    const html = new TextDecoder().decode(plainBuf);

    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    errEl.style.display = 'block';
  }
}

document.getElementById('pw').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') tryDecrypt();
});
</script>
