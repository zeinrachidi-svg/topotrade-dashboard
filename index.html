function unlock() {
  var pw = document.getElementById('pw').value;
  try {
    var decrypted = CryptoJS.AES.decrypt(payload, pw);
    var text = decrypted.toString(CryptoJS.enc.Utf8);
    if (!text) { throw new Error('bad password'); }
    var blob = new Blob([text], {type: 'text/html'});
    var url = URL.createObjectURL(blob);
    var iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;border:0;z-index:9999;background:#fff;';
    document.body.appendChild(iframe);
  } catch (e) {
    document.getElementById('err').style.display = 'block';
  }
}
document.getElementById('pw').addEventListener('keydown', function(e) { if (e.key === 'Enter') unlock(); });
