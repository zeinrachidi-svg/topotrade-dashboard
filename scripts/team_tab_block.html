<!--TEAMTAB--><div id='team' class='tabcontent'><style>.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.subtab{border:1px solid #c9d3dd;background:#fff;color:#1f3b57;padding:6px 14px;border-radius:16px;cursor:pointer;font:inherit;font-size:13px}.subtab.active{background:#1f3b57;color:#fff;border-color:#1f3b57}#teamframe{width:100%;height:1500px;border:0;display:block;background:transparent}</style><div class='banner blue'><b>Team Dashboards.</b> Each person's personal view (performance, recommended tasks, all open tasks). Pick a name.</div><div class='subtabs'><button class='subtab active' data-t='345eb47d3e0e3785' onclick="teamSub(this)">Zein</button><button class='subtab' data-t='2f2e6526497cf31e' onclick="teamSub(this)">Georges</button><button class='subtab' data-t='922afdb7367596c5' onclick="teamSub(this)">Mireille</button><button class='subtab' data-t='2bcfcba157e47b8c' onclick="teamSub(this)">Daniel</button><button class='subtab' data-t='5ef69159a0d034d9' onclick="teamSub(this)">Claude</button><button class='subtab' data-t='ab87c3017bcfc86d' onclick="teamSub(this)">Celine</button><button class='subtab' data-t='ab54d9cf161742ea' onclick="teamSub(this)">Yara</button></div><iframe id='teamframe' title='Personal dashboard' data-loaded=''></iframe><script>function teamSub(b){document.querySelectorAll('.subtab').forEach(function(x){x.classList.remove('active')});b.classList.add('active');document.getElementById('teamframe').src='team/'+b.getAttribute('data-t')+'/?v='+Date.now();}(function(){var f=document.getElementById('teamframe');var o=document.querySelector("button[onclick*=\"showTab('team')\"]");if(o)o.addEventListener('click',function(){if(!f.getAttribute('src')){var b=document.querySelector('.subtab.active');teamSub(b);}});})();</script></div><!--/TEAMTAB-->
