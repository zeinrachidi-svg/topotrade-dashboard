<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Topotrade team dashboard</title>
<meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1d2733;--mut:#64748b;--navy:#1f3b57;--org:#c97a2b;--line:#dde3ea;--hl:#fdf1e3;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#17212d;--ink:#e6edf4;--mut:#93a3b5;--navy:#8fb4dc;--org:#e8a257;--line:#2a3849;--hl:#2d2418}}
[hidden]{display:none!important}*{box-sizing:border-box}html,body{background:var(--bg);margin:0}
body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);padding-inline:16px;padding-block:18px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header h1{margin:0;font-size:clamp(20px,5vw,28px);color:var(--navy)}header .r{color:var(--org);font-weight:600}
.asof,.note{color:var(--mut);font-size:12.5px;margin:4px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.kl{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}.kv{font-size:22px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}.ks{font-size:12px;color:var(--mut)}
nav{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:6px;z-index:2}
nav button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
nav button[aria-selected=true]{background:var(--navy);color:var(--bg);border-color:var(--navy)}
nav button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--org);outline-offset:2px}
nav .c{opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:8px;min-width:0}
h2{font-size:16px;margin:10px 0 2px;color:var(--navy)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);white-space:nowrap}tr:last-child td{border-bottom:0}
tr.me td{background:var(--hl);font-weight:600}
.acts{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 14px 14px 36px}
.acts li{padding-left:2px}
details.grp{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px 10px 10px}
details.grp>summary{cursor:pointer;font-weight:600;color:var(--navy);padding:9px 0;list-style-position:inside}
.cnt{display:inline-block;background:var(--org);color:#fff;border-radius:99px;padding:0 8px;font-size:12px;margin-left:6px;font-variant-numeric:tabular-nums}
#q{width:100%;max-width:420px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.err{background:var(--card);border:1px solid var(--org);border-radius:10px;padding:14px}
footer{color:var(--mut);font-size:12px}
a{color:var(--navy)}
</style>
</head><body><div class="wrap">
<header><h1 id="who">Loading...</h1><div class="r" id="role"></div><div class="asof" id="asof"></div></header>
<div class="err" id="err" hidden>Could not load your data. Reload in a minute; if it keeps failing, tell Zein.</div>
<div class="kpis" id="kpis"></div>
<nav aria-label="Sections"><button id="t-rec" aria-selected="true">Recommended actions <span class="c" id="c-rec"></span></button>
<button id="t-task" aria-selected="false">All my tasks <span class="c" id="c-task"></span></button>
<button id="t-perf" aria-selected="false">Performance</button></nav>
<div id="qwrap" hidden><input id="q" type="search" placeholder="Filter all tasks (customer, item, keyword)"></div>
<section id="p-rec"></section><section id="p-task" hidden></section><section id="p-perf" hidden></section>
<footer>Private link: please don't forward. Numbers come from the Cockpit sheet and Odoo via the daily 07:13 run. Main dashboard: <a href="../../">all tabs</a>.</footer>
</div>
<script>window.TT="ab54d9cf161742ea"</script>
<script src="../app.js?v=5"></script>
</body></html>
